name: Issue triage

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  apply-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply queued issue triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/apply-issue-triage.mjs
