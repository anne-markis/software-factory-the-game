name: CI

# Typecheck + tests on every PR. The only other workflow is
# release-and-deploy.yml, which runs after merge to main — so a tsc error in a
# test used to pass Vitest, merge, then fail deploy.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run test
