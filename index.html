<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Factory</title>
    <style>
      body { font-family: ui-monospace, monospace; max-width: 1280px; margin: 1rem auto; padding: 0 1rem; }
      button { font-family: inherit; margin: 2px; }
      /* Single-line, non-reflowing stats bar: each stat is a fixed-width slot
         (label + tabular-nums value) so a value changing width on tick never
         shifts anything below. Width classes are sized for each stat's
         realistic maximum so normal play never triggers the scrollbar. */
      .stats { display: flex; flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; gap: 0.5rem; font-size: 0.95rem; margin-bottom: 1rem; }
      .stat { display: inline-block; }
      .stat-label { color: #666; }
      .stat-value { display: inline-block; font-variant-numeric: tabular-nums; text-align: right; }
      .stat-value.v-day { min-width: 5ch; } /* Day: up to ~5 digits */
      .stat-value.v-flow { min-width: 9ch; } /* Backlog/Shipped: e.g. "12,345.6" */
      .stat-value.v-count { min-width: 6ch; } /* In Progress/Done */
      .stat-value.v-budget { min-width: 10ch; } /* Budget: e.g. "$123,456.7" */
      .stat-value.v-debt { min-width: 7ch; } /* Tech Debt */
      .stat-value.v-rate { min-width: 5ch; } /* Points/Day */
      .panel { border: 1px solid #999; padding: 0.5rem 1rem; margin-bottom: 1rem; }
      .panel h4 { margin: 0.75rem 0 0.25rem; font-size: 0.95rem; }
      .panel h4:first-of-type { margin-top: 0.25rem; }
      .panel h4 small { font-weight: normal; color: #666; }
      .log { max-height: 160px; overflow-y: auto; font-size: 0.85rem; }
      .stall { background: #fdd; padding: 0.5rem; font-weight: bold; }
      .loops { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
      .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1rem; align-items: start; }
      .side { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: 0; max-height: calc(100vh - 2rem); overflow-y: auto; }
      .side .log { max-height: 50vh; }
      @media (max-width: 900px) {
        .loops { grid-template-columns: 1fr; }
        .cols { grid-template-columns: 1fr; }
        .side { position: static; order: -1; max-height: none; }
      }
    </style>
  </head>
  <body>
    <h1>Software Factory</h1>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
