<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Factory</title>
    <style>
      /* Cockpit layout (Release 22, design doc section 2): html/body fill the
         viewport with no margin so #app can become a full-height flex column;
         the previous body max-width/centering moves onto .page so the
         centered 1280px column is preserved unchanged. */
      html, body { height: 100%; margin: 0; }
      body { font-family: ui-monospace, monospace; }
      .page { max-width: 1280px; margin: 0 auto; padding: 0 1rem; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
      .page h1 { flex: 0 0 auto; margin: 1rem 0 0.5rem; }
      /* #app is the flex column itself: a fixed header (.cockpit-header) plus
         a body that flex-fills the remainder and scrolls internally
         (.cockpit-body). flex:1 1 auto + min-height:0 on both #app and
         .cockpit-body is required -- without min-height:0 a flex child won't
         shrink below its content size and the body never gets its own
         scrollbar (it pushes the page taller instead). */
      #app { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
      .cockpit-header { flex: 0 0 auto; }
      .cockpit-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
      button { font-family: inherit; margin: 2px; }
      /* Non-reflowing stats bar: each stat is a fixed-width slot (label +
         tabular-nums value) so a value changing width on tick never shifts
         anything below. Laid out as an auto-filling grid rather than one
         nowrap line: a single line could not fit a ninth stat (reputation)
         even at the 1280px body max, silently scrolling Points/Day off
         screen. The grid wraps predictably instead, and the row count only
         changes when a stat is added or removed (never during play), so the
         no-reflow guarantee holds while leaving room for future stocks. */
      .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0.25rem 0.5rem; white-space: nowrap; font-size: 0.95rem; margin-bottom: 1rem; }
      .stat { display: inline-block; }
      .stat-label { color: #666; }
      .stat-value { display: inline-block; font-variant-numeric: tabular-nums; text-align: right; }
      .stat-value.v-day { min-width: 5ch; } /* Day: up to ~5 digits */
      .stat-value.v-flow { min-width: 9ch; } /* Backlog/Shipped: e.g. "12,345.6" */
      .stat-value.v-count { min-width: 6ch; } /* In Progress/Done */
      .stat-value.v-budget { min-width: 10ch; } /* Budget: e.g. "$123,456.7" */
      .stat-value.v-debt { min-width: 7ch; } /* Tech Debt */
      .stat-value.v-rep { min-width: 7ch; } /* Reputation */
      .stat-value.v-rate { min-width: 5ch; } /* Points/Day */
      .panel { border: 1px solid #999; padding: 0.5rem 1rem; margin-bottom: 1rem; }
      .panel h4 { margin: 0.75rem 0 0.25rem; font-size: 0.95rem; }
      .panel h4:first-of-type { margin-top: 0.25rem; }
      .panel h4 small { font-weight: normal; color: #666; }
      .log { max-height: 160px; overflow-y: auto; font-size: 0.85rem; }
      /* Tech tree (Alter the loop). Each chain is a left-to-right row of tier
         columns joined by an arrow glyph; nodes stack vertically within a
         column. Node card sizes are fixed by their own static content (cost,
         category, description are constant per node once rendered) so ticking
         numbers elsewhere on the page never reflow this panel -- see the R14
         layout-stability guarantee referenced in render.ts. */
      .tt-chain { margin-bottom: 1rem; }
      .tt-chain-row { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; }
      .tt-tier { display: flex; flex-direction: column; gap: 0.5rem; min-width: 190px; }
      .tt-arrow { flex: none; align-self: center; padding: 0 0.5rem; color: #666; font-size: 1.1rem; }
      .tt-standalone-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .tt-standalone-grid .tt-node, .tt-tier .tt-node { width: 190px; }
      .tt-node { border: 1px solid #999; padding: 0.4rem 0.5rem; font-size: 0.85rem; box-sizing: border-box; }
      .tt-node-name { font-weight: bold; }
      .tt-node-meta { color: #666; display: flex; justify-content: space-between; gap: 0.5rem; margin: 0.15rem 0; }
      /* Gamble chip: a decision whose outcome is a lucky-or-unlucky roll at
         purchase. Reuses the existing amber warning tone (.tt-reason / .stall
         family) as an outlined badge so it reads as "risk here" at a glance,
         distinct from the plain dim category label beside it. */
      .tt-gamble { color: #a60; border: 1px solid #a60; border-radius: 3px; padding: 0 0.25rem; margin-right: 0.3rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .tt-node-desc { color: #444; margin-bottom: 0.25rem; }
      /* Derived effects line (Release 20 card legibility): terse, numbers-only
         summary generated from the decision's structured effects data (see
         src/ui/effectSummary.ts), rendered beneath the authored description.
         Dimmer than .tt-node-desc so the authored benefit/catch prose reads
         first and the hard numbers read as a quieter confirmation underneath
         -- reuses the existing #666 dim tone from .tt-node-meta rather than
         introducing a new color. */
      .tt-effects { color: #666; font-size: 0.8rem; margin-bottom: 0.25rem; }
      .tt-node-state { margin-bottom: 0.25rem; }
      .tt-reason { color: #a60; }
      .tt-node.tt-locked { opacity: 0.5; }
      .tt-node.tt-owned { opacity: 0.6; }
      .tt-node.tt-owned .tt-tag-state { font-weight: bold; }
      .tt-node.tt-cannot-afford .tt-reason { color: #c00; }
      /* Time-control group (Release 19): Pause/Resume + one button per
         speed. Fixed-width buttons so the group's footprint never changes
         as the active marker moves or the Pause/Resume label flips --
         same no-reflow guarantee as .stat-value (see render.ts). The
         active speed uses the same dimming/weight vocabulary as
         .tt-owned rather than a new color. */
      .time-controls { margin-bottom: 0.5rem; }
      .tc-btn { display: inline-block; min-width: 4.5rem; text-align: center; opacity: 0.6; }
      .tc-btn.tc-active { opacity: 1; font-weight: bold; }
      .stall { background: #fdd; padding: 0.5rem; font-weight: bold; }
      /* Header height budget (design doc section 3): stats + time controls +
         both loops can approach 730px, which would starve the scrolling body
         on a laptop viewport. Capping .loops at 42vh with its own
         overflow-y:auto means a tall screen shows everything and a short one
         scrolls the loops within their own bounded region instead of eating
         the whole viewport. */
      .loops { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; max-height: 42vh; overflow-y: auto; }
      /* Left loop column stacks the (short) delivery diagram over the stats
         grid, filling the vertical dead space beside the taller progress
         loop rather than leaving it empty. The stats sit in ~half width, so
         the auto-fill grid drops to ~3 columns and grows downward into that
         space; because the progress loop still governs the row height, this
         adds no overflow beyond what already existed. */
      .loop-left { display: flex; flex-direction: column; }
      .loop-left .stats { margin-bottom: 0; }
      /* Time controls + reset, moved above the loops (top of the header). */
      .controls-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
      .controls-row .time-controls { margin-bottom: 0; }
      /* Tab bar (Release 22 cockpit layout, design doc section 5): fixed-width
         buttons so the bar never reflows as the active marker moves -- same
         no-reflow guarantee as .tc-btn. The active tab reuses the .tc-active
         dimming/weight vocabulary rather than a new color. */
      .tab-bar { margin-bottom: 0.5rem; }
      .tab-btn { display: inline-block; min-width: 6rem; text-align: center; opacity: 0.6; }
      .tab-btn.tab-active { opacity: 1; font-weight: bold; }
      @media (max-width: 900px) {
        .loops { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Software Factory</h1>
      <div id="app"></div>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
