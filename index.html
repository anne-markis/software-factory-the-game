<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Factory</title>
    <style>
      /* Issue #10: without color-scheme + explicit fg/bg, prefers-color-scheme:
         dark forces the canvas near-black while every hardcoded tone below
         (#666/#999/#a60/#c00/#444/#fdd, plus default body text) stays put,
         collapsing contrast to near-invisible. Custom properties hold the
         light-mode palette (values unchanged from before this fix) and are
         overridden below for dark mode, so every tone gets a contrast-safe
         counterpart instead of being silently left behind. */
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #000;
        --fg-dim: #666;
        --border: #999;
        --accent-amber: #a60;
        --accent-red: #c00;
        --desc: #444;
        --stall-bg: #fdd;
        --stall-fg: #000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181818;
          --fg: #e8e8e8;
          --fg-dim: #aaa;
          --border: #888;
          --accent-amber: #e0a030;
          --accent-red: #ff6b6b;
          --desc: #c2c2c2;
          --stall-bg: #4a1f1f;
          --stall-fg: #ffd6d6;
        }
      }
      body { font-family: ui-monospace, monospace; max-width: 1280px; margin: 1rem auto; padding: 0 1rem; color: var(--fg); background: var(--bg); }
      button { font-family: inherit; margin: 2px; }
      /* Title is the game name only. Eras stay off the player chrome — silent
         crossings still swap the shop/pool, but Studio/Company never appear
         as a heading or tab title. */
      .game-title { font-size: 1.6rem; margin: 0 0 0.75rem; }
      /* Start/speed sit on the left of the chrome row; Reset is pinned to
         the right of that same row. Reset is a static sibling (not inside
         the patched time-controls block) so pause/speed flips never rebuild it. */
      .chrome-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.5rem; }
      .chrome-row #reset { margin-left: auto; }
      /* Top stats bar (Day / Backlog / Budget / Points/Day): fixed 4-column
         grid so Budget + runway cannot paint into Points/Day (issue #113).
         minmax(0, 1fr) lets each track shrink; .stat min-width:0 + overflow
         clips long runway strings inside the cell. tabular-nums + value
         min-widths keep tick updates from reflowing the loops below.
         Issue #8 moved flow/quality stocks under the Delivery loop. */
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem 1rem; align-items: baseline; white-space: nowrap; font-size: 0.95rem; margin-bottom: 1rem; }
      .stat { display: inline-flex; align-items: baseline; gap: 0.5rem; min-width: 0; overflow: hidden; }
      .stat-label { color: var(--fg-dim); }
      .stat-value { display: inline-block; font-variant-numeric: tabular-nums; text-align: right; }
      .stat-value.v-day { min-width: 5ch; } /* Day: up to ~5 digits */
      .stat-value.v-flow { min-width: 9ch; } /* Backlog/Shipped: e.g. "12,345.6" */
      .stat-value.v-count { min-width: 6ch; } /* In Progress/Done */
      /* Budget may append "(N days)" runway. No ch min-width: a wide
         right-aligned slot wasted space after the label and clipped the
         amount (issue #113). Left-align so a tight column keeps the $
         visible and clips the runway suffix first. The 4-column grid
         keeps neighbors stable. */
      .stat-value.v-budget { min-width: 0; text-align: left; }
      /* Issue #37: low runway telegraph — reuse the existing danger red
         so payroll cliff reads before Events fill with removals. */
      .stat-value.budget-low { color: var(--accent-red); font-weight: bold; }
      .stat-value.v-debt { min-width: 7ch; } /* Tech Debt */
      .stat-value.v-rep { min-width: 7ch; } /* Reputation */
      .stat-value.v-users { min-width: 8ch; } /* Users */
      .stat-value.v-rate { min-width: 5ch; } /* Points/Day */
      /* Issue #67: brief pulse when a material cockpit/delivery number
         changes. Amber underline + opacity (existing risk tone), single
         shot — presence without a new effect language. prefers-reduced-motion
         disables it. */
      @keyframes stat-flash-pulse {
        from {
          opacity: 0.4;
          box-shadow: inset 0 -2px 0 var(--accent-amber);
        }
        to {
          opacity: 1;
          box-shadow: inset 0 -2px 0 transparent;
        }
      }
      .stat-value.stat-flash {
        animation: stat-flash-pulse 480ms ease-out 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .stat-value.stat-flash { animation: none; }
      }
      /* Issue #67: hire/gamble reveal (not log-only). Sticky on the section
         host (not the inner node) so a purchase made while scrolled into
         Alter the system still pins the outcome to the viewport. Amber
         outcome tone matches .tt-gamble; no card chrome. */
      [data-section="gamble-reveal"]:not(:empty) {
        position: sticky;
        top: 0;
        z-index: 5;
        margin: 0 0 0.75rem;
        background: var(--bg);
        border-bottom: 1px solid var(--accent-amber);
      }
      .gamble-reveal {
        padding: 0.35rem 0;
        font-size: 1rem;
        color: var(--fg);
      }
      .gamble-reveal-outcome { color: var(--accent-amber); font-weight: bold; }
      /* Issue #40: Decision-needed interrupt. Sticky on the section host so
         shopping / Alter the system cannot bury the choice while the day clock
         is paused. Danger border matches prior Choices panel cue. */
      [data-section="choices"]:not(:empty) {
        position: sticky;
        top: 0;
        z-index: 6;
        margin: 0 0 0.75rem;
        background: var(--bg);
      }
      /* Higher specificity than later .panel { border; margin-bottom } so the
         danger cue actually wins (same single-class specificity otherwise). */
      .panel.choice-interrupt {
        border-color: var(--accent-red);
        margin-bottom: 0;
      }
      .choice-interrupt-item { margin-top: 0.35rem; }
      /* Issue #8: relocated stocks under the Delivery loop column. Flex
         wrap (not the 900px loops stack) so they stay inside that column
         at any width without introducing a horizontal scrollbar. */
      .delivery-column { min-width: 0; }
      .delivery-stats { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; white-space: nowrap; font-size: 0.95rem; margin: -0.25rem 0 1rem; }
      .panel { border: 1px solid var(--border); padding: 0.5rem 1rem; margin-bottom: 1rem; }
      .panel h4 { margin: 0.75rem 0 0.25rem; font-size: 0.95rem; }
      .panel h4:first-of-type { margin-top: 0.25rem; }
      .panel h4 small { font-weight: normal; color: var(--fg-dim); }
      /* Fixed ~7-line Events history; older lines scroll inside the box so
         Owned below it stays visible in the right rail (issue #114). */
      .log { line-height: 1.35; max-height: calc(1.35em * 7); overflow-y: auto; font-size: 0.85rem; }
      /* Tech tree (Alter the system). Each chain is a left-to-right row of tier
         columns joined by an arrow glyph; nodes stack vertically within a
         column. Node card sizes are fixed by their own static content (cost,
         category, description are constant per node once rendered) so ticking
         numbers elsewhere on the page never reflow this panel -- see the R14
         layout-stability guarantee referenced in render.ts. */
      .tt-chain { margin-bottom: 1rem; }
      .tt-chain-row { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; }
      .tt-tier { display: flex; flex-direction: column; gap: 0.5rem; min-width: 190px; }
      .tt-arrow { flex: none; align-self: center; padding: 0 0.5rem; color: var(--fg-dim); font-size: 1.1rem; }
      .tt-standalone-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .tt-standalone-grid .tt-node, .tt-tier .tt-node { width: 190px; }
      .tt-node { border: 1px solid var(--border); padding: 0.4rem 0.5rem; font-size: 0.85rem; box-sizing: border-box; }
      .tt-node-name { font-weight: bold; }
      .tt-node-meta { color: var(--fg-dim); display: flex; justify-content: space-between; gap: 0.5rem; margin: 0.15rem 0; }
      /* Gamble chip: a decision whose outcome is a lucky-or-unlucky roll at
         purchase. Reuses the existing amber warning tone (.tt-reason / .stall
         family) as an outlined badge so it reads as "risk here" at a glance,
         distinct from the plain dim category label beside it. */
      .tt-gamble { color: var(--accent-amber); border: 1px solid var(--accent-amber); border-radius: 3px; padding: 0 0.25rem; margin-right: 0.3rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .tt-node-desc { color: var(--desc); margin-bottom: 0.25rem; }
      /* Derived effects line (Release 20 card legibility): terse, numbers-only
         summary generated from the decision's structured effects data (see
         src/ui/effectSummary.ts), rendered beneath the authored description.
         Dimmer than .tt-node-desc so the authored benefit/catch prose reads
         first and the hard numbers read as a quieter confirmation underneath
         -- reuses the existing #666 dim tone from .tt-node-meta rather than
         introducing a new color. */
      .tt-effects { color: var(--fg-dim); font-size: 0.8rem; margin-bottom: 0.25rem; }
      /* Issue #15: Owned list mirrors shop cost + derived-effects so upkeep
         trim decisions are scannable without hunting the tech tree. */
      .owned-item { margin-bottom: 0.5rem; }
      .owned-item-head { margin-bottom: 0.15rem; }
      .owned-cost { color: var(--fg-dim); font-size: 0.85rem; }
      .owned-item .tt-effects { margin-bottom: 0; }
      .tt-node-state { margin-bottom: 0.25rem; }
      .tt-reason { color: var(--accent-amber); }
      .tt-node.tt-locked { opacity: 0.5; }
      .tt-node.tt-owned { opacity: 0.6; }
      .tt-node.tt-owned .tt-tag-state { font-weight: bold; }
      .tt-node.tt-cannot-afford .tt-reason { color: var(--accent-red); }
      /* Time-control group (Release 19 / issue #98): Start/Pause + one
         button per speed. Fixed-width buttons so the group's footprint
         never changes as the active marker moves or the Start/Pause label
         flips -- same no-reflow guarantee as .stat-value (see render.ts).
         The active control (current speed while running, Start while
         paused) uses the same dimming/weight vocabulary as .tt-owned
         rather than a new color. */
      .time-controls { margin-bottom: 0; }
      .tc-btn { display: inline-block; min-width: 4.5rem; text-align: center; opacity: 0.6; }
      .tc-btn.tc-active { opacity: 1; font-weight: bold; }
      .stall { background: var(--stall-bg); color: var(--stall-fg); padding: 0.5rem; font-weight: bold; }
      .loops { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
      .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1rem; align-items: start; }
      /* minmax(0, 1fr) on the track alone isn't enough: a grid item's default
         min-width is auto (its content's min-content size), so the tech
         tree's fixed-width tier columns would still overflow the .main
         column and drag the whole page into horizontal scroll. min-width: 0
         lets .main shrink to the track. On wide viewports, overflow stays
         inside .tt-chain-row (overflow-x: auto); on narrow viewports the
         media query below stacks tiers so that scroll region is unused. */
      .main { min-width: 0; }
      .side { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: 0; max-height: calc(100vh - 2rem); overflow-y: auto; }
      /* Issue #45: quiet build identity under the game. Dim so it never
         competes with the loops or time controls; still selectable for
         bug reports. */
      .build-stamp { margin-top: 1.5rem; font-size: 0.8rem; color: var(--fg-dim); }
      .build-stamp a { color: inherit; }
      /* Issue #18: below the single-column layout threshold, stack tech-tree
         tiers top-to-bottom instead of one overflow-x region per chain.
         Fixed 190px card widths + 2–4 tiers overflow ~390px phones and force
         a sideways swipe per row while the page itself scrolls vertically.
         Full-width cards keep names/descriptions readable without truncation
         at the viewport edge; rotate the existing → glyph to read as ↓. */
      @media (max-width: 900px) {
        .loops { grid-template-columns: 1fr; }
        .cols { grid-template-columns: 1fr; }
        .side { position: static; order: -1; max-height: none; }
        .tt-chain-row {
          flex-direction: column;
          align-items: stretch;
          overflow-x: visible;
          gap: 0.25rem;
        }
        .tt-tier { min-width: 0; width: 100%; }
        .tt-standalone-grid .tt-node, .tt-tier .tt-node { width: 100%; max-width: 100%; }
        .tt-arrow {
          transform: rotate(90deg);
          padding: 0.15rem 0;
          align-self: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
